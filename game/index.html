<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marola Game</title>

    <script src="https://cdn.jsdelivr.net/npm/phaser@v4.2.1/dist/phaser.min.js"></script>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #111;
        overflow: hidden;
      }

      .hud {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;

        position: fixed;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;

        height: 50px;
      }

      .hud-ovos {
        background-color: #121212;
        color: #ffd700;
        border: 2px solid #ffd700;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        font-weight: bold;
        font-size: 16px;
        text-transform: uppercase;
        letter-spacing: 1px;

        padding: 10px 20px;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);

        display: flex;
        align-items: center;
        gap: 10px;
        user-select: none;
      }

      .hud-ovos span {
        font-size: 18px;
        color: #ffffff;
      }

      .hud-stamina {
        position: fixed;
        bottom: 70px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;
        width: 120px;
        height: 12px;
        background-color: rgba(18, 18, 18, 0.8);
        border: 2px solid #ffd700;
        border-radius: 6px;
        overflow: hidden;
      }

      #preenchimento-stamina {
        width: 100%;
        height: 100%;
        background-color: #00ff88;
        transition: width 0.1s linear;
      }

      .btn-sair-rep {

        background-color: #121212;
        color: #ffd700;
        border: 2px solid #ffd700;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        font-weight: bold;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 1px;

        padding: 12px 24px;
        border-radius: 8px;
        cursor: pointer;

        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        transition: all 0.3s ease;

        display: flex;
        align-items: center;
        gap: 8px;
      }

      .btn-sair-rep:hover {
        background-color: #ffd700;
        color: #121212;
        box-shadow: 0 6px 20px rgba(255, 215, 0, 0.4);
      }

      .btn-sair-rep:active {
        box-shadow: 0 2px 8px rgba(255, 215, 0, 0.2);
      }
    </style>
  </head>
  <body>
    <div class="hud-stamina">
      <div id="preenchimento-stamina"></div>
    </div>

    <div class="hud">
      <div class="hud-ovos">🥚 Ovos: <span id="contador-ovos">0</span></div>

      <a href="../index.html" style="text-decoration: none">
        <button class="btn-sair-rep">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
      </a>
    </div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
